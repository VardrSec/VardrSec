name: Image evidence collection
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  collect-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Build declared development images without starting services
        run: |
          python vardrsec.py configure
          python vardrsec.py sources
          python vardrsec.py build
      - name: Collect all image SBOMs and unfiltered vulnerability reports
        run: python image_evidence.py collect
      - name: Preserve image evidence, including blocked findings
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: development-image-evidence
          path: artifacts/image-evidence/run-*/reports/
          if-no-files-found: error
          retention-days: 7
