name: Distribution foundation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Validate development source manifest
        run: |
          python - <<'PY'
          import json, re
          from pathlib import Path
          manifest = json.loads(Path('versions.json').read_text())
          assert type(manifest['schema_version']) is int and manifest['schema_version'] == 1
          assert manifest['status'] == 'development'
          assert manifest['distribution_release'] is None
          assert manifest['runnable'] is False and manifest['images'] == {}
          expected = {'map': 'VardrSec/VardrMap', 'runner': 'VardrSec/VardrRunner', 'gate': 'VardrSec/VardrGate'}
          assert set(manifest['components']) == set(expected)
          for name, repository in expected.items():
              item = manifest['components'][name]
              assert item['repository'] == repository
              assert re.fullmatch('[0-9a-f]{40}', item['commit'])
          assert manifest['components']['map']['readiness_contract'] == 1
          assert manifest['components']['runner']['readiness_contract'] == 1
          PY
