name: Compose acceptance
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      unit_only:
        description: Run the existing cross-platform Python compatibility jobs only
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  guides:
    uses: ./.github/workflows/guide-changes.yml
  database:
    needs: guides
    if: ${{ !cancelled() && needs.guides.outputs.guide_only != 'true' && (github.event_name != 'workflow_dispatch' || inputs.unit_only != true) }}
    uses: ./.github/workflows/database-cache.yml
    with:
      use_cache: ${{ github.event_name != 'workflow_dispatch' }}
    secrets:
      VARDRSEC_DB_CACHE_KEY: ${{ secrets.VARDRSEC_DB_CACHE_KEY }}
  certificate-renewal:
    needs: guides
    if: ${{ !cancelled() && needs.guides.outputs.guide_only != 'true' && (github.event_name != 'workflow_dispatch' || inputs.unit_only != true) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Verify automatic leaf renewal, CA persistence and verified HTTPS
        run: python tests/certificate_renewal_acceptance.py
      - name: Verify database transport on the latest Ubuntu Docker engine
        if: github.event_name == 'pull_request'
        run: bash tests/database_bundle_acceptance.sh
  python-compatibility:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.10'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.4'
          cache: false
      - name: Build pinned official age tools
        shell: bash
        env:
          GOBIN: ${{ runner.temp }}/age-bin
          GOTOOLCHAIN: local
          GODEBUG: http2client=0
        run: |
          mkdir -p "$GOBIN"
          go install filippo.io/age/cmd/age@v1.3.2 filippo.io/age/cmd/age-keygen@v1.3.2
          echo "$GOBIN" >> "$GITHUB_PATH"
      - run: python -m unittest discover -s tests -p 'test_*.py'
  mapless-installation:
    needs: guides
    if: ${{ !cancelled() && needs.guides.outputs.guide_only != 'true' && (github.event_name != 'workflow_dispatch' || inputs.unit_only != true) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      # Manual qualification, main pushes and the release candidate use a fresh builder.
      ROUTINE_CACHE: ${{ github.event_name == 'pull_request' && github.base_ref == 'main' && github.head_ref != 'codex/community-alpha-candidate' && github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Select a dedicated Runner builder
        if: env.ROUTINE_CACHE == 'true'
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
        with:
          name: mapless-ci
          driver-opts: default-load=true
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 4
      - name: Select cache inputs
        if: env.ROUTINE_CACHE == 'true'
        id: inputs
        run: |
          jq -er '"pins=" + .components.runner.commit + "-" + .components.gate.commit' versions.json >> "$GITHUB_OUTPUT"
          echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - name: Restore Runner build layers
        if: env.ROUTINE_CACHE == 'true'
        id: layers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .ci-mapless-build-layers
          key: mapless-layers-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.inputs.outputs.week }}-${{ steps.inputs.outputs.pins }}-${{ hashFiles('compose.mapless.json') }}
      - name: Resolve the pinned Runner build for cache transfer
        if: env.ROUTINE_CACHE == 'true'
        env:
          COMPOSE_PROJECT_NAME: vardrsec-mapless-review
        run: |
          python vardrsec.py sources --mapless
          docker compose --profile tools -f compose.mapless.json build --print runner > "$RUNNER_TEMP/mapless-bake.json"
      - name: Import layers into the installer's builder
        if: steps.layers.outputs.cache-hit == 'true'
        run: |
          docker buildx bake --builder mapless-ci -f "$RUNNER_TEMP/mapless-bake.json" runner \
            --set "runner.cache-from=type=local,src=$GITHUB_WORKSPACE/.ci-mapless-build-layers" \
            --set runner.output=type=cacheonly
      - name: Verify pinned Mapless authorization, native execution and portable evidence
        env:
          BUILDX_BUILDER: ${{ env.ROUTINE_CACHE == 'true' && 'mapless-ci' || '' }}
          BUILDKIT_PROGRESS: plain
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, "tests")
          from gate_acceptance import run_mapless_workflow
          run_mapless_workflow()
          PY
      - name: Record the installer build duration and cached package stages
        if: env.ROUTINE_CACHE == 'true'
        run: |
          docker buildx history ls --builder mapless-ci --format json
          docker buildx history logs --builder mapless-ci --progress plain 2>&1 |
            awk '/^#[0-9]+ .*RUN .*dpkg-buildpackage/ {step[$1]=$0} /^#[0-9]+ (DONE|CACHED)/ && $1 in step {print step[$1]; print $0}'
      - name: Export Runner build layers after acceptance
        if: env.ROUTINE_CACHE == 'true' && steps.layers.outputs.cache-hit != 'true'
        run: |
          # Replay only the two verified source contexts on the builder used by install.
          docker buildx bake --builder mapless-ci -f "$RUNNER_TEMP/mapless-bake.json" runner \
            --set "runner.cache-to=type=local,dest=$GITHUB_WORKSPACE/.ci-mapless-build-layers,mode=min" \
            --set runner.output=type=cacheonly
      - name: Preserve the sanitized Mapless workflow receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: mapless-installed-gate-acceptance
          path: artifacts/installed-gate/mapless.json
          if-no-files-found: error
          retention-days: 30
  installation:
    needs: [guides, database]
    if: >-
      ${{ !cancelled() && needs.guides.outputs.guide_only != 'true' &&
      (needs.database.result == 'success' || needs.database.result == 'skipped') &&
      (github.event_name != 'workflow_dispatch' || inputs.unit_only != true) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Verify configuration and source preservation
        run: python -m unittest discover -s tests -p 'test_*.py'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.4'
          cache: false
      - name: Build pinned official age tools
        shell: bash
        env:
          GOBIN: ${{ runner.temp }}/age-bin
          GOTOOLCHAIN: local
          GODEBUG: http2client=0
        run: |
          mkdir -p "$GOBIN"
          go install filippo.io/age/cmd/age@v1.3.2 filippo.io/age/cmd/age-keygen@v1.3.2
          echo "$GOBIN" >> "$GITHUB_PATH"
      - name: Verify genuinely clean Ubuntu installation host
        run: python tests/ubuntu_installation.py preflight
      - name: Verify encrypted transport using an inert local image
        if: github.event_name == 'pull_request'
        run: bash tests/database_bundle_acceptance.sh
      - name: Load the verified database if available
        if: needs.database.outputs.cache_key != ''
        uses: ./.github/actions/load-database
        with:
          cache-key: ${{ needs.database.outputs.cache_key }}
          passphrase: ${{ secrets.VARDRSEC_DB_CACHE_KEY }}
      - name: Exercise local qualification on changes to the database or installer
        if: github.event_name == 'pull_request' && env.VARDRSEC_DATABASE_RECEIPT == ''
        run: |
          # The first parent of GitHub's PR merge is the base. Other PRs exercise
          # the ordinary source install directly when the private cache is off.
          if git diff --quiet HEAD^1 HEAD -- db qualification/kerberos-image compose.yaml \
              database_image.py database_roles.py import_database.py vardrsec.py install.sh \
              .github/workflows/compose.yml .github/workflows/database-cache.yml \
              .github/actions/load-database scripts/ci/database_bundle.py scripts/ci/database_bundle.sh; then
            exit 0
          fi
          python database_image.py prepare --receipt "$RUNNER_TEMP/local-db.json"
          echo "VARDRSEC_DATABASE_RECEIPT=$RUNNER_TEMP/local-db.json" >> "$GITHUB_ENV"
      - name: Install with the documented one-command path
        env:
          COMPOSE_PROJECT_NAME: vardrsec-compose-review
        run: |
          python vardrsec.py install
          python -c "from pathlib import Path; import recovery; recovery.compose(Path.cwd(), 'config', '--quiet')"
          docker build -t vardrsec-browser:acceptance tests/browser
      - name: Match the frozen and running database to its qualification receipt
        if: env.VARDRSEC_DATABASE_RECEIPT != ''
        env:
          COMPOSE_PROJECT_NAME: vardrsec-compose-review
        run: python tests/verify_installed_database.py
      - name: Verify trusted installation, Gate workflow, restart and installed ACL payloads
        env:
          COMPOSE_PROJECT_NAME: vardrsec-compose-review
        run: |
          python tests/acl_runtime_acceptance.py capture
          python tests/ubuntu_installation.py enroll
          python tests/compose_acceptance.py
          python tests/acl_runtime_acceptance.py verify
      - name: Preserve ACL payload results and per-image diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: installed-acl-runtime
          path: artifacts/acl-runtime/
          if-no-files-found: ignore
          retention-days: 30
      - name: Verify read-only glibc locale and environment exposure (CVE-2026-84243)
        run: python tests/glibc_locale_acceptance.py
      - name: Verify least-privilege database role (fresh install, existing-volume upgrade, recovery)
        run: python tests/database_role_acceptance.py
      - name: Preserve database role receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: database-role-receipt
          path: artifacts/role-receipt/
          if-no-files-found: ignore
          retention-days: 7
      - name: Verify container privilege posture (register decision R1)
        run: python tests/container_capabilities_acceptance.py
      - name: Preserve container capability receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: container-capabilities
          path: artifacts/container-capabilities/
          if-no-files-found: ignore
          retention-days: 7
      - name: Preserve glibc locale receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: glibc-locale-exposure
          path: artifacts/glibc-locale/
          if-no-files-found: ignore
          retention-days: 7
      - name: Remove only the disposable Ubuntu installation CA
        if: always()
        run: python tests/ubuntu_installation.py cleanup
      - name: Preserve installed workflow receipts and browser evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: installed-gate-acceptance
          path: artifacts/installed-gate/
          if-no-files-found: ignore
          retention-days: 7
      - name: Verify portable recovery and migration failure
        run: python tests/recovery_acceptance.py
      - name: Stop restored disposable fixture
        if: always()
        run: |
          if test -f artifacts/recovery-drill/restored/.active-images.json; then
            if test "${{ job.status }}" != success; then
              docker compose -f artifacts/recovery-drill/restored/compose.yaml -f artifacts/recovery-drill/restored/.active-images.json -p vardrsec-restore-acceptance logs --tail 30 proxy
            fi
            docker compose --profile tools -f artifacts/recovery-drill/restored/compose.yaml -f artifacts/recovery-drill/restored/.active-images.json -p vardrsec-restore-acceptance down --volumes --remove-orphans
          fi
      - name: Stop disposable fixture and remove its data
        if: always()
        run: python -c "from pathlib import Path; import recovery; recovery.compose(Path.cwd(), '--profile', 'tools', 'down', '--volumes', '--remove-orphans', project='vardrsec-compose-review')"
  controlled-updates:
    needs: [guides, database]
    if: >-
      ${{ !cancelled() && needs.guides.outputs.guide_only != 'true' &&
      (needs.database.result == 'success' || needs.database.result == 'skipped') &&
      (github.event_name != 'workflow_dispatch' || inputs.unit_only != true) }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Load the verified database if available
        if: needs.database.outputs.cache_key != ''
        uses: ./.github/actions/load-database
        with:
          cache-key: ${{ needs.database.outputs.cache_key }}
          passphrase: ${{ secrets.VARDRSEC_DB_CACHE_KEY }}
      - name: Interrupt the install part-way, then resume it
        env:
          COMPOSE_PROJECT_NAME: vardrsec-compose-review
        run: |
          # Kill the first run during source acquisition/build. Credentials must survive and the
          # rerun must complete the install without regenerating or overwriting them.
          timeout 40 python vardrsec.py install || true
          test -f .env
          (umask 077; cp .env "$RUNNER_TEMP/install-original.env")
          python vardrsec.py install
          python - <<'PY'
          import json, os
          from pathlib import Path
          import recovery
          original = (Path(os.environ["RUNNER_TEMP"]) / "install-original.env").read_bytes()
          current = Path(".env").read_bytes()
          assert current.startswith(original), "Existing configuration bytes changed during resume"
          suffix = current[len(original):].decode("utf-8")
          if suffix:
              lines = [line for line in suffix.splitlines() if line]
              expected_keys = {"COMPOSE_PROJECT_NAME", "APPLICATION_SUBNET", "APPLICATION_IP_RANGE", "PROXY_IP"}
              assert len(lines) == len(expected_keys), "Unexpected resumed-install configuration additions"
              additions = dict(line.split("=", 1) for line in lines)
              assert set(additions) == expected_keys, "Unexpected resumed-install configuration keys"
              model = json.loads(recovery.compose(Path.cwd(), "--profile", "tools", "config",
                                                  "--format", "json", capture_output=True, text=True).stdout)
              application = model["networks"]["application"]["ipam"]["config"][0]
              assert additions == {
                  "COMPOSE_PROJECT_NAME": "vardrsec-compose-review",
                  "APPLICATION_SUBNET": application["subnet"],
                  "APPLICATION_IP_RANGE": application["ip_range"],
                  "PROXY_IP": model["services"]["proxy"]["networks"]["application"]["ipv4_address"],
              }, "Resumed installation routing differs from its selected model"
              assert model["name"] == additions["COMPOSE_PROJECT_NAME"]
          PY
      - name: Confirm a started installation is protected from a second install
        env:
          COMPOSE_PROJECT_NAME: vardrsec-compose-review
        run: |
          if python vardrsec.py install; then echo 'install must refuse after first start'; exit 1; fi
      - name: Match the resumed database to the imported qualification receipt
        if: env.VARDRSEC_DATABASE_RECEIPT != ''
        env:
          COMPOSE_PROJECT_NAME: vardrsec-compose-review
        run: python tests/verify_installed_database.py
      - name: Confirm the install exported the public CA
        run: test -s trust/root.crt
      - name: Exercise explicit controlled updates
        env:
          COMPOSE_PROJECT_NAME: vardrsec-compose-review
        run: python tests/update_acceptance.py
      - name: Remove disposable update projects
        if: always()
        run: |
          for name in rejected successful apply-failed recovered; do
            folder="artifacts/update-drill/$name"
            if test -f "$folder/.active-images.json"; then
              docker compose --profile tools -f "$folder/compose.yaml" -f "$folder/.active-images.json" -p "vardrsec-restore-update-$name" down --volumes --remove-orphans
            fi
          done
          if test -f .env; then
            python -c "from pathlib import Path; import recovery; recovery.compose(Path.cwd(), '--profile', 'tools', 'down', '--volumes', '--remove-orphans', project='vardrsec-compose-review')"
          fi
