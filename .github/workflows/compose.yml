name: Compose acceptance
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      unit_only:
        description: Run the existing cross-platform Python compatibility jobs only
        type: boolean
        default: true
      nm2_coupled:
        description: Explicitly run the reviewed initial NM-2 harness on a fresh Ubuntu VM
        type: boolean
        default: false
      nm2_scenario:
        description: Explicit reviewed NM-2 acceptance scenario
        type: choice
        options: [healthy, persistent-availability, persistent-count-limit, persistent-idle-limit, persistent-empty-stop, persistent-launch-empty, persistent-launch-completed, persistent-launch-stop-work, persistent-launch-stop-work-queued, persistent-launch-local-stop, persistent-launch-missing-grant, persistent-launch-grant-revocation]
        default: healthy
      nm2_database_revision:
        description: Require the exact reviewed Map schema; does not migrate or enable work
        type: choice
        options: [0040runtimesequence, 0041persistentruntime]
        default: 0040runtimesequence
      nm2_distribution_sha:
        description: Exact reviewed distribution SHA, must equal the selected workflow commit
        type: string
        default: ''
      nm2_map_sha:
        description: Exact reviewed Map SHA
        type: string
        default: ''
      nm2_runner_sha:
        description: Exact reviewed Runner SHA
        type: string
        default: ''
      nm2_gate_sha:
        description: Exact reviewed Gate SHA
        type: string
        default: ''
permissions:
  contents: read
jobs:
  nm2-coupled:
    if: github.event_name == 'workflow_dispatch' && inputs.nm2_coupled == true
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Verify hosted refusal and public receipt guards without Docker
        run: python -m unittest discover -s tests -p test_nm2_worker_hosted.py
      - name: Run the exact explicitly selected coupled cohort
        env:
          NM2_COUPLED: ${{ inputs.nm2_coupled }}
          NM2_SCENARIO: ${{ inputs.nm2_scenario }}
          NM2_DATABASE_REVISION: ${{ inputs.nm2_database_revision }}
          NM2_DISTRIBUTION_SHA: ${{ inputs.nm2_distribution_sha }}
          NM2_MAP_SHA: ${{ inputs.nm2_map_sha }}
          NM2_RUNNER_SHA: ${{ inputs.nm2_runner_sha }}
          NM2_GATE_SHA: ${{ inputs.nm2_gate_sha }}
        run: python tests/nm2_worker_hosted.py --execute
      - name: Retain only the sanitized public NM-2 receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: nm2-coupled-public-receipt
          path: ${{ runner.temp }}/nm2-hosted-public/receipt.json
          if-no-files-found: warn
          retention-days: 7
      # No image publication, cleanup/prune or upload of private fixture output.
  certificate-renewal:
    if: github.event_name != 'workflow_dispatch' || inputs.unit_only != true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Verify automatic leaf renewal, CA persistence and verified HTTPS
        run: python tests/certificate_renewal_acceptance.py
  python-compatibility:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.10'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.3'
          cache: false
      - name: Build pinned official age tools
        shell: bash
        env:
          GOBIN: ${{ runner.temp }}/age-bin
          GOTOOLCHAIN: local
          GODEBUG: http2client=0
        run: |
          mkdir -p "$GOBIN"
          go install filippo.io/age/cmd/age@v1.3.2 filippo.io/age/cmd/age-keygen@v1.3.2
          echo "$GOBIN" >> "$GITHUB_PATH"
      - run: python -m unittest discover -s tests -p 'test_*.py'
  installation:
    if: github.event_name != 'workflow_dispatch' || inputs.unit_only != true
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Verify configuration and source preservation
        run: python -m unittest discover -s tests -p 'test_*.py'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.3'
          cache: false
      - name: Build pinned official age tools
        shell: bash
        env:
          GOBIN: ${{ runner.temp }}/age-bin
          GOTOOLCHAIN: local
          GODEBUG: http2client=0
        run: |
          mkdir -p "$GOBIN"
          go install filippo.io/age/cmd/age@v1.3.2 filippo.io/age/cmd/age-keygen@v1.3.2
          echo "$GOBIN" >> "$GITHUB_PATH"
      - name: Verify genuinely clean Ubuntu installation host
        run: python tests/ubuntu_installation.py preflight
      - name: Install with the documented one-command path
        env:
          COMPOSE_PROJECT_NAME: vardrsec-compose-review
        run: |
          python vardrsec.py install
          docker compose config --quiet
          docker build -t vardrsec-browser:acceptance tests/browser
      - name: Verify trusted installation, explicit Gate workflow and restart
        env:
          COMPOSE_PROJECT_NAME: vardrsec-compose-review
        run: |
          python tests/ubuntu_installation.py enroll
          python tests/compose_acceptance.py
      - name: Verify read-only glibc locale and environment exposure (CVE-2026-84243)
        run: python tests/glibc_locale_acceptance.py
      - name: Verify least-privilege database role (fresh install, existing-volume upgrade, recovery)
        run: python tests/database_role_acceptance.py
      - name: Preserve database role receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: database-role-receipt
          path: artifacts/role-receipt/
          if-no-files-found: ignore
          retention-days: 7
      - name: Verify container privilege posture (register decision R1)
        run: python tests/container_capabilities_acceptance.py
      - name: Preserve container capability receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: container-capabilities
          path: artifacts/container-capabilities/
          if-no-files-found: ignore
          retention-days: 7
      - name: Preserve glibc locale receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: glibc-locale-exposure
          path: artifacts/glibc-locale/
          if-no-files-found: ignore
          retention-days: 7
      - name: Remove only the disposable Ubuntu installation CA
        if: always()
        run: python tests/ubuntu_installation.py cleanup
      - name: Preserve installed workflow receipts and browser evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: installed-gate-acceptance
          path: artifacts/installed-gate/
          if-no-files-found: ignore
          retention-days: 7
      - name: Verify portable recovery and migration failure
        run: python tests/recovery_acceptance.py
      - name: Stop restored disposable fixture
        if: always()
        run: |
          if test -f artifacts/recovery-drill/restored/.active-images.json; then
            if test "${{ job.status }}" != success; then
              docker compose -f artifacts/recovery-drill/restored/compose.yaml -f artifacts/recovery-drill/restored/.active-images.json -p vardrsec-restore-acceptance logs --tail 30 proxy
            fi
            docker compose --profile tools -f artifacts/recovery-drill/restored/compose.yaml -f artifacts/recovery-drill/restored/.active-images.json -p vardrsec-restore-acceptance down --volumes --remove-orphans
          fi
      - name: Stop disposable fixture and remove its data
        if: always()
        run: docker compose --profile tools -p vardrsec-compose-review down --volumes --remove-orphans
  controlled-updates:
    if: github.event_name != 'workflow_dispatch' || inputs.unit_only != true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Interrupt the install part-way, then resume it
        env:
          COMPOSE_PROJECT_NAME: vardrsec-compose-review
        run: |
          # Kill the first run during source acquisition/build. Credentials must survive and the
          # rerun must complete the install without regenerating or overwriting them.
          timeout 40 python vardrsec.py install || true
          test -f .env
          sha256sum .env > "$RUNNER_TEMP/env.sha256"
          python vardrsec.py install
          sha256sum -c "$RUNNER_TEMP/env.sha256"
      - name: Confirm a started installation is protected from a second install
        env:
          COMPOSE_PROJECT_NAME: vardrsec-compose-review
        run: |
          if python vardrsec.py install; then echo 'install must refuse after first start'; exit 1; fi
      - name: Confirm the install exported the public CA
        run: test -s trust/root.crt
      - name: Exercise explicit controlled updates
        env:
          COMPOSE_PROJECT_NAME: vardrsec-compose-review
        run: python tests/update_acceptance.py
      - name: Remove disposable update projects
        if: always()
        run: |
          for name in rejected successful apply-failed recovered; do
            folder="artifacts/update-drill/$name"
            if test -f "$folder/.active-images.json"; then
              docker compose --profile tools -f "$folder/compose.yaml" -f "$folder/.active-images.json" -p "vardrsec-restore-update-$name" down --volumes --remove-orphans
            fi
          done
          docker compose --profile tools -p vardrsec-compose-review down --volumes --remove-orphans
