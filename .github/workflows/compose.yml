name: Compose acceptance
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  python-compatibility:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.10'
      - run: python -m unittest discover -s tests -p 'test_*.py'
  installation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Verify configuration and source preservation
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Prepare pinned source build
        run: |
          python vardrsec.py configure
          python vardrsec.py sources
          docker compose config --quiet
          python vardrsec.py build
          docker build -t vardrsec-browser:acceptance tests/browser
      - name: Verify trusted HTTPS installation and restart
        env:
          COMPOSE_PROJECT_NAME: vardrsec-compose-review
        run: |
          python vardrsec.py start
          python vardrsec.py export-ca
          python tests/compose_acceptance.py
      - name: Verify portable recovery and migration failure
        run: python tests/recovery_acceptance.py
      - name: Stop restored disposable fixture
        if: always()
        run: |
          if test -f artifacts/recovery-drill/restored/.active-images.json; then
            if test "${{ job.status }}" != success; then
              docker compose -f artifacts/recovery-drill/restored/compose.yaml -f artifacts/recovery-drill/restored/.active-images.json -p vardrsec-restore-acceptance logs --tail 30 proxy
            fi
            docker compose --profile tools -f artifacts/recovery-drill/restored/compose.yaml -f artifacts/recovery-drill/restored/.active-images.json -p vardrsec-restore-acceptance down --volumes --remove-orphans
          fi
      - name: Stop disposable fixture and remove its data
        if: always()
        run: docker compose --profile tools -p vardrsec-compose-review down --volumes --remove-orphans
  controlled-updates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Prepare pinned image set
        run: |
          python vardrsec.py configure
          python vardrsec.py sources
          python vardrsec.py build
      - name: Exercise explicit controlled updates
        env:
          COMPOSE_PROJECT_NAME: vardrsec-compose-review
        run: |
          python vardrsec.py start
          python vardrsec.py export-ca
          python tests/update_acceptance.py
      - name: Remove disposable update projects
        if: always()
        run: |
          for name in rejected successful apply-failed recovered; do
            folder="artifacts/update-drill/$name"
            if test -f "$folder/.active-images.json"; then
              docker compose --profile tools -f "$folder/compose.yaml" -f "$folder/.active-images.json" -p "vardrsec-restore-update-$name" down --volumes --remove-orphans
            fi
          done
          docker compose --profile tools -p vardrsec-compose-review down --volumes --remove-orphans
