name: Native certificate trust
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  native-store:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - name: Prepare isolated browser
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/vardrsec-browser" --no-audit --no-fund playwright@1.64.1
          echo "NODE_PATH=$RUNNER_TEMP/vardrsec-browser/node_modules" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/vardrsec-browser/node_modules/.bin/playwright" install chromium
      - name: Verify actual native certificate enrollment and removal
        run: python tests/native_trust/acceptance.py
