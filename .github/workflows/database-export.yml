name: Export qualified database to one recipient
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recipient:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      public_key: ${{ steps.check.outputs.public_key }}
    steps:
      - id: check
        name: Require the repository owner's configured native age recipient
        env:
          CACHE_ENABLED: ${{ vars.VARDRSEC_DB_CACHE_ENABLED }}
          RECIPIENT: ${{ vars.VARDRSEC_DB_INSTALL_RECIPIENT }}
        shell: bash
        run: |
          if [[ "$CACHE_ENABLED" != true ]]; then
            echo 'Enable VARDRSEC_DB_CACHE_ENABLED to export the qualified database' >&2
            exit 1
          fi
          if ! [[ "$RECIPIENT" =~ ^age1[ac-hj-np-z02-9]{58}$ ]]; then
            echo "Configure VARDRSEC_DB_INSTALL_RECIPIENT for the owner's private installation" >&2
            exit 1
          fi
          echo "public_key=$RECIPIENT" >> "$GITHUB_OUTPUT"
  database:
    if: github.ref == 'refs/heads/main'
    needs: recipient
    uses: ./.github/workflows/database-cache.yml
    secrets:
      VARDRSEC_DB_CACHE_KEY: ${{ secrets.VARDRSEC_DB_CACHE_KEY }}
  export:
    if: github.ref == 'refs/heads/main'
    needs: [recipient, database]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CACHE_KEY: ${{ needs.database.outputs.cache_key }}
      RECIPIENT: ${{ needs.recipient.outputs.public_key }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Require the exact database cache identity
        shell: bash
        run: '[[ "$CACHE_KEY" =~ ^qualified-db-v1-[0-9a-f]{64}$ ]] || { echo "A configured private database cache is required" >&2; exit 1; }'
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/vardrsec-database.gpg
          key: ${{ needs.database.outputs.cache_key }}
          fail-on-cache-miss: true
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.4'
          cache: false
      - name: Install the pinned official age tool
        env:
          GOBIN: ${{ runner.temp }}/age-bin
          GOTOOLCHAIN: local
          GODEBUG: http2client=0
        run: |
          mkdir -p "$GOBIN"
          go install filippo.io/age/cmd/age@v1.3.2
          echo "$GOBIN" >> "$GITHUB_PATH"
      - name: Authenticate the database bundle and encrypt it for this recipient
        env:
          PASSPHRASE: ${{ secrets.VARDRSEC_DB_CACHE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 -c 'import os, backup_crypto; backup_crypto.check_recipient(os.environ["RECIPIENT"])'
          work=$(mktemp -d "$RUNNER_TEMP/database-export.XXXXXXXX")
          trap 'rm -rf -- "$work"' EXIT
          bash scripts/ci/database_bundle.sh authenticate "$RUNNER_TEMP/vardrsec-database.gpg" "$work/bundle.tar"
          unset PASSPHRASE
          python3 scripts/ci/database_bundle.py unpack-receipt "$work/bundle.tar" "$work/receipt.json"
          artifact="$RUNNER_TEMP/database.tar.age"
          age --encrypt --recipient "$RECIPIENT" --output "$artifact" "$work/bundle.tar"
          digest=$(sha256sum -- "$artifact" | cut -d' ' -f1)
          printf 'Main commit `%s`\n\nRecipient `%s`\n\nCache identity `%s`\n\nCiphertext SHA-256 `%s`\n' \
            "$GITHUB_SHA" "$RECIPIENT" "$CACHE_KEY" "$digest" >> "$GITHUB_STEP_SUMMARY"
      - name: Retain only the recipient-encrypted database
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: database-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/database.tar.age
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
