name: Qualified Kerberos database image acceptance
on:
  pull_request:
    paths:
      - '.github/workflows/kerberos-image.yml'
      - '.github/workflows/database-cache.yml'
      - '.github/actions/load-database/**'
      - 'scripts/ci/database_bundle.*'
      - 'database_image.py'
      - 'database_release.py'
      - 'versions.json'
      - 'qualification/kerberos-image/**'
      - 'qualification/kerberos-vm/test_*.py'
      - 'db/**'
permissions:
  contents: read
jobs:
  database:
    uses: ./.github/workflows/database-cache.yml
    secrets:
      VARDRSEC_DB_CACHE_KEY: ${{ secrets.VARDRSEC_DB_CACHE_KEY }}
  accept-candidate:
    needs: database
    if: ${{ !cancelled() && (needs.database.result == 'success' || needs.database.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Validate fail-closed artifact consumption
        run: |
          python -m unittest discover -s qualification/kerberos-image -v
          bash -n qualification/kerberos-image/verify.sh
          python -m unittest discover -s qualification/kerberos-vm -v
          bash -n db/kerberos-vm/guest.sh
      - name: Load the qualified database for this recipe
        if: needs.database.outputs.cache_key != ''
        uses: ./.github/actions/load-database
        with:
          cache-key: ${{ needs.database.outputs.cache_key }}
          passphrase: ${{ secrets.VARDRSEC_DB_CACHE_KEY }}
      - name: Select the published database when the private cache is unavailable
        if: needs.database.outputs.cache_key == ''
        run: python3 scripts/ci/database_bundle.py select-release
      - name: Select the database for independent installed-image checks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/kerberos-image
          if [[ -n "${VARDRSEC_DATABASE_RECEIPT:-}" ]]; then
            image=$(jq -er '.image_id' "$VARDRSEC_DATABASE_RECEIPT")
            docker image inspect --format '{{.Id}}' "$image" | tee artifacts/kerberos-image/build.log
          else
            python vardrsec.py configure
            docker compose -f compose.yaml -f qualification/kerberos-image/compose.candidate.json build --progress plain db \
              2>&1 | tee artifacts/kerberos-image/build.log
            image=vardr-db-qualified-candidate
          fi
          echo "QUALIFICATION_DATABASE=$image" >> "$GITHUB_ENV"
      - name: Verify installed bytes, corresponding source and isolated PostgreSQL smoke
        run: bash qualification/kerberos-image/verify.sh "$QUALIFICATION_DATABASE"
      - name: Collect stopped-image legal notices and bounded component inventory
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_runtime_notice_evidence.py'
          image=$(cat artifacts/kerberos-image/image-id.txt)
          container=$(docker create "$image")
          trap 'docker rm "$container" >/dev/null' EXIT
          docker export "$container" | python runtime_notice_evidence.py \
            --image-id "$image" --service db --distribution-commit "$(git rev-parse HEAD)" \
            --output artifacts/kerberos-image/runtime-notices.tar
          docker rm "$container" >/dev/null
          trap - EXIT
      - name: Preserve candidate acceptance evidence without publication
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: kerberos-image-acceptance
          path: artifacts/kerberos-image/
          if-no-files-found: error
          retention-days: 14
