name: NM-3 Community Full candidate verification
# Isolated synthetic verification under standing branch/CI authorization.
on:
  push:
    branches: [codex/nm3-community-full-verification]
    paths-ignore:
      - 'docs/**'
      - 'CHANGELOG.md'
permissions:
  contents: read
jobs:
  full-fresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.3'
          cache: false
      - name: Build pinned official age tools
        shell: bash
        env:
          GOBIN: ${{ runner.temp }}/age-bin
          GOTOOLCHAIN: local
          GODEBUG: http2client=0
        run: |
          mkdir -p "$GOBIN"
          go install filippo.io/age/cmd/age@v1.3.2 filippo.io/age/cmd/age-keygen@v1.3.2
          echo "$GOBIN" >> "$GITHUB_PATH"
      - name: Verify host, daemon and candidate guards without Docker mutation
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Verify standard one-command Full installation on the fresh VM daemon
        run: python tests/nm3_development_full_ci.py --installed-lifecycle
      - name: Retain only sanitized public receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: nm3-community-full-receipt
          path: ${{ runner.temp }}/nm3-community-full/public/receipt.json
          if-no-files-found: warn
          retention-days: 7
      # No explicit stop/down/rm/prune, CA removal or private-output upload.
      # The hosted platform disposes of the fresh VM after the job.
