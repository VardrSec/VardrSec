name: Tool and network acceptance
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  tool-network:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Build toolkit from declared source pins
        run: |
          python vardrsec.py configure
          python vardrsec.py sources
          docker compose --profile tools build runner
      - name: Verify selected tool modes and synthetic networking
        run: python tests/tool_network_acceptance.py
      - name: Preserve bounded acceptance receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: tool-network-${{ matrix.os }}
          path: artifacts/tool-network/
          if-no-files-found: ignore
          retention-days: 7
