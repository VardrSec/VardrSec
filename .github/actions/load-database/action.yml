name: Load a verified database image
description: Restore the encrypted database and select its verified receipt for this job.
inputs:
  cache-key:
    description: Exact cache key returned by the database producer
    required: true
  passphrase:
    description: Private database cache passphrase
    required: true
runs:
  using: composite
  steps:
    - id: restore
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: ${{ runner.temp }}/vardrsec-database.gpg
        key: ${{ inputs.cache-key }}
    - if: steps.restore.outputs.cache-hit == 'true'
      shell: bash
      env:
        PASSPHRASE: ${{ inputs.passphrase }}
        CACHE_KEY: ${{ inputs.cache-key }}
      run: bash scripts/ci/database_bundle.sh load
    - if: steps.restore.outputs.cache-hit != 'true'
      shell: bash
      run: echo 'Qualified cache entry unavailable. Building the database from source.' >> "$GITHUB_STEP_SUMMARY"
